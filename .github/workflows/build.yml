name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/lazypower/comfyui

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # uv from the upstream installer rather than the marketplace action: this
      # runs the same `uv run --with pytest` the justfile does, so CI and a
      # developer execute an identical command. Pinned to the version the
      # images are built with -- see runtime.uv in the manifest.
      - name: Install uv
        run: |
          version="$(python3 -c "import json;print(json.load(open('manifest/nodes.lock.json'))['runtime']['uv'])")"
          curl -LsSf "https://astral.sh/uv/${version}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lockfiles agree with pinned commits
        run: python3 scripts/lock_check.py

      - name: Manifest and prune-logic checks
        run: uv run --with pytest python -m pytest tests/ -q

  image:
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, rocm]
    steps:
      # These images are 7-13GB and need roughly twice that transiently while
      # the layer is committed. A stock runner starts with ~22GB free of ~72GB,
      # most of it preinstalled toolchains this build never touches.
      #
      # Inlined rather than using a marketplace action on purpose: this job
      # holds packages:write against the registry, and six lines of rm is a
      # smaller thing to trust than a third-party action with push rights.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift \
                      /usr/local/lib/node_modules /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v5

      - name: Read build args from the lock
        id: args
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          lock = json.load(open("manifest/nodes.lock.json"))
          backend = "${{ matrix.backend }}"
          print(f"apt={' '.join(lock['backends'][backend]['apt'])}")
          print(f"python={lock['runtime']['python']}")
          PY

      # Docker media types, no attestation index. Podman reads HEALTHCHECK only
      # from a Docker-format image config; from an OCI image it silently runs
      # the container with no healthcheck at all.
      - name: Build
        run: |
          docker build \
            --provenance=false \
            --output type=image,oci-mediatypes=false \
            --file containers/Containerfile \
            --build-arg BACKEND=${{ matrix.backend }} \
            --build-arg BACKEND_APT="${{ steps.args.outputs.apt }}" \
            --build-arg PYTHON_VERSION="${{ steps.args.outputs.python }}" \
            --tag comfyui:ci-${{ matrix.backend }} \
            .

      - name: Image is Docker format
        run: |
          media="$(curl -sf --unix-socket /var/run/docker.sock \
            http://localhost/images/comfyui:ci-${{ matrix.backend }}/json \
            | python3 -c 'import json,sys; print((json.load(sys.stdin).get("Descriptor") or {}).get("mediaType", ""))')"
          echo "manifest media type: ${media:-<none reported>}"
          case "$media" in
            application/vnd.docker.distribution.manifest.v2+json) ;;
            *) echo "::error::expected a Docker v2 manifest; podman drops HEALTHCHECK from OCI images"; exit 1 ;;
          esac

      - name: Disk after build
        if: always()
        run: df -h / && docker images comfyui --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # Everything a GPU-less runner can prove: the dependency closure resolves
      # and hash-verifies, every pinned node imports, the venv is immutable, the
      # state mount is enforced, ComfyUI registers its nodes and serves on CPU,
      # and the torch wheel is the correct accelerator variant.
      #
      # What it CANNOT prove: that kernels actually run. `just test-gpu` covers
      # that and must run on the target host -- see README.
      - name: Runtime contract (no GPU required)
        env:
          ENGINE: docker
          IMAGE: comfyui:ci-${{ matrix.backend }}
          BACKEND: ${{ matrix.backend }}
        run: bash tests/smoke.sh

      - name: Push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          short="$(echo "${{ github.sha }}" | cut -c1-12)"
          for tag in "main-${{ matrix.backend }}" "$short-${{ matrix.backend }}"; do
            docker tag comfyui:ci-${{ matrix.backend }} "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
